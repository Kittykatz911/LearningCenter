<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/CSS/entryForm.css">
    <title>Login</title>
</head>

<body>
    <div class="entryForm-container">
        <h1>Welcome</h1>

        <form method="POST" id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input autocomplete="current-password" type="password" id="password" name="password" required>
            <br>
            <button type="submit">Login</button>
        </form>
    </div>

    <footer>
        <p class="footer-text">Don't have an account? <a href="/signup">Sign up</a></p>
    </footer>
    <script src="/src/ts/signOn.js" type="module"></script>
</body>

</html>
