<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/CSS/entryForm.css">
    <title>Sign Up</title>
</head>

<body>
    <div class="entryForm-container">
        <h1>Create Account</h1>

        <form action="/signup" method="POST" id="signupForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input autocomplete="current-password" type="password" id="password" name="password" required>
            <br>
            <button id="signupButton" type="submit">Sign Up</button>
        </form>
    </div>

    <footer>
        <p class="footer-text">Already have an account? <a href="/login">Log in</a></p>
    </footer>
</body>

</html>
